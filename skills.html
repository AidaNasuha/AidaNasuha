<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio - Career & Skills Slides</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CYBER MATRIX BACKGROUND ANIMATION */
        #cyber-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.12;
        }

        /* ADJUSTED CONTAINER TO FIT 4 COLUMNS COMFORTABLY */
        .container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: 1350px;
            max-width: 95vw;
            height: 750px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .slide-indicator {
            text-align: right;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        /* SLIDE SYSTEM */
        .slide {
            display: none;
            animation: slideIn 0.4s ease-in-out forwards;
            height: 100%;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* CLEAN TEXT ONLY LAYOUT FOR REFLECTION & CAREER */
        .text-layout {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* 4 IMAGES IN 1 ROW GRID */
        .quad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        /* 3 IMAGES IN 1 ROW GRID */
        .triple-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 25px;
        }

        .artifact-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .artifact-card:hover {
            border-color: #38bdf8;
            transform: translateY(-4px);
            background: rgba(30, 41, 59, 0.9);
        }

        h2 {
            color: #38bdf8;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
            font-size: 1.7rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        h3 { color: #818cf8; font-size: 1.3rem; margin-top: 0; }
        p, li { line-height: 1.6; color: #cbd5e1; font-size: 1rem; margin-bottom: 10px; }
        ul { padding-left: 20px; margin-top: 5px; }

        /* ARTIFACT SCREENSHOT STYLE */
        .lab-screenshot {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            object-fit: cover;
            background: #1e293b;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: bold;
            color: #38bdf8;
            font-size: 0.95rem;
            margin: 0 0 8px 0;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0;
            line-height: 1.4;
            text-align: left;
        }

        /* TABLES */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.95rem;
        }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background-color: #4f46e5; color: white; }

        /* BUTTONS */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

            padding: 12px 35px;
